<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">ReviewCrew review flow</title>
  <desc id="desc">Five stages show how ReviewCrew accepts code, runs static analysis and custom rules, asks the selected AI reviewer persona, saves structured findings, and presents an actionable report.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#44536a"/></marker>
    <style>
      .h{font:600 17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#17243a}.b{font:14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#45536a}.s{font:12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#65738a}.n{font:600 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#fff}.ey{font:600 11px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:1.2px;fill:#52647e}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="428" rx="18" fill="#f7f6f2" stroke="#d8d7d0"/>
  <text x="36" y="42" class="ey">REVIEW FLOW · ONE TRACEABLE PATH</text>
  <text x="36" y="72" class="h">From submitted code to findings a developer can act on</text>

  <g transform="translate(35 128)">
    <rect width="202" height="212" rx="12" fill="#fff" stroke="#b9c4d2" stroke-width="1.5"/>
    <circle cx="27" cy="29" r="15" fill="#355c7d"/><text x="27" y="33" text-anchor="middle" class="n">01</text>
    <text x="52" y="34" class="ey">SUBMIT</text>
    <text x="20" y="82" class="h">Choose input</text>
    <text x="20" y="112" class="b">Paste code, diff,</text>
    <text x="20" y="133" class="b">related files, or a</text>
    <text x="20" y="154" class="b">pull request link.</text>
    <text x="20" y="187" class="s">Select a reviewer persona.</text>
  </g>
  <g transform="translate(274 128)">
    <rect width="202" height="212" rx="12" fill="#fff" stroke="#b9c4d2" stroke-width="1.5"/>
    <circle cx="27" cy="29" r="15" fill="#52745b"/><text x="27" y="33" text-anchor="middle" class="n">02</text>
    <text x="52" y="34" class="ey">CHECK</text>
    <text x="20" y="82" class="h">Run static scans</text>
    <text x="20" y="112" class="b">Secret patterns,</text>
    <text x="20" y="133" class="b">custom rules, and</text>
    <text x="20" y="154" class="b">Python analysis.</text>
    <text x="20" y="187" class="s">Deterministic checks first.</text>
  </g>
  <g transform="translate(513 128)">
    <rect width="202" height="212" rx="12" fill="#fff" stroke="#b9c4d2" stroke-width="1.5"/>
    <circle cx="27" cy="29" r="15" fill="#816b45"/><text x="27" y="33" text-anchor="middle" class="n">03</text>
    <text x="52" y="34" class="ey">REVIEW</text>
    <text x="20" y="82" class="h">Ask the model</text>
    <text x="20" y="112" class="b">OpenRouter receives</text>
    <text x="20" y="133" class="b">the code context and</text>
    <text x="20" y="154" class="b">persona instructions.</text>
    <text x="20" y="187" class="s">Key is kept on the server.</text>
  </g>
  <g transform="translate(752 128)">
    <rect width="202" height="212" rx="12" fill="#fff" stroke="#b9c4d2" stroke-width="1.5"/>
    <circle cx="27" cy="29" r="15" fill="#725e7f"/><text x="27" y="33" text-anchor="middle" class="n">04</text>
    <text x="52" y="34" class="ey">SAVE</text>
    <text x="20" y="82" class="h">Structure results</text>
    <text x="20" y="112" class="b">Findings, evidence,</text>
    <text x="20" y="133" class="b">severity, metrics,</text>
    <text x="20" y="154" class="b">and generated tests.</text>
    <text x="20" y="187" class="s">Saved in Neon Postgres.</text>
  </g>
  <g transform="translate(991 128)">
    <rect width="174" height="212" rx="12" fill="#fff" stroke="#b9c4d2" stroke-width="1.5"/>
    <circle cx="27" cy="29" r="15" fill="#355c7d"/><text x="27" y="33" text-anchor="middle" class="n">05</text>
    <text x="52" y="34" class="ey">ACT</text>
    <text x="20" y="82" class="h">Explore report</text>
    <text x="20" y="112" class="b">Open a finding,</text>
    <text x="20" y="133" class="b">inspect the diff,</text>
    <text x="20" y="154" class="b">ask a follow-up.</text>
    <text x="20" y="187" class="s">Review fixes before use.</text>
  </g>
  <path d="M240 234H263" stroke="#44536a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M479 234H502" stroke="#44536a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M718 234H741" stroke="#44536a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M957 234H980" stroke="#44536a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="36" y="388" class="s">Static findings and model findings are labeled separately so reviewers can inspect where each result came from.</text>
</svg>
