# Alembic configuration.
#
# Alembic is the migration tool: it turns Python schema definitions into
# versioned SQL changes, so teammates (and the judge's laptop) can build the
# same database with one command instead of hand-running CREATE TABLE.
#
#   alembic revision --autogenerate -m "add column"   # write a migration
#   alembic upgrade head                              # apply migrations
#   alembic downgrade -1                              # undo the last one
#
# The database URL is NOT stored here - alembic/env.py reads it from the
# DATABASE_URL environment variable (via app/config.py) so credentials never
# live in a tracked file.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
version_path_separator = os
# Overridden at runtime by env.py.
sqlalchemy.url = postgresql+psycopg://reviewpilot:reviewpilot@localhost:5432/reviewpilot

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
